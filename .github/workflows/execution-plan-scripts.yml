name: execution-plan scripts

on:
  push:
    paths:
      - ".agents/skills/execution-plan/scripts/**"
      - ".github/workflows/execution-plan-scripts.yml"
  pull_request:
    paths:
      - ".agents/skills/execution-plan/scripts/**"
      - ".github/workflows/execution-plan-scripts.yml"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning .agents/skills/execution-plan/scripts/*.sh .agents/skills/execution-plan/scripts/tests/*.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: bash .agents/skills/execution-plan/scripts/tests/run-tests.sh -v
